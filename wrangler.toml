# ============================================================
# Wrangler configuration for the المكسيكي Cloudflare Pages project
# ============================================================

name = "almexiky"
compatibility_date = "2024-09-23"
pages_build_output_dir = "public"

# ---- D1 database binding ----
# After running `wrangler d1 create almexiky-db`, copy the database_id
# it prints and paste it below (also set this same binding in the
# Cloudflare dashboard under Pages project > Settings > Functions >
# D1 database bindings, using variable name "DB").
[[d1_databases]]
binding = "DB"
database_name = "almexiky-db"
database_id = "REPLACE_WITH_YOUR_DATABASE_ID"

# ---- Secrets (do NOT put real values here — use `wrangler pages secret put`) ----
# Required secrets (see README.md for exact commands):
#   SETUP_SECRET      - one-time secret used to promote the first admin account
#   RESEND_API_KEY    - (optional) enables real password-reset emails
#   RESEND_FROM_EMAIL - (optional) e.g. "المكسيكي <no-reply@yourdomain.com>"
